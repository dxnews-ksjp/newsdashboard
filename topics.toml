# ===========================================================
#  ニュースダッシュボードの設定ファイル
#  ここを書き換えて保存（Commit）すると、ページが自動で作り直されます。
# ===========================================================

# ページのタイトル
title = "最新ニュース（物流、DX関連）"

# タイトルの下に小さく表示する説明文
subtitle = "毎朝7時ごろに自動で更新されます。"

# トピックごとに表示する記事の件数
max_items = 10

# -----------------------------------------------------------
#  トピックの一覧
#  ・追加したいとき … [[topics]] から query の行までの3行をコピーして下に貼り付け、
#                      name と query を書き換えます
#  ・削除したいとき … その3行を消します
#  ・name  … カードに表示する名前
#  ・query … Googleニュースで検索する言葉
#            例） "物流 DX"        → 両方の言葉を含む記事
#                 "港湾 OR 港運"   → どちらかの言葉を含む記事
#  ※ 文字は必ず " " （半角のダブルクォーテーション）で囲んでください
# -----------------------------------------------------------

[[topics]]
name = "物流DX"
query = "物流DX"

[[topics]]
name = "生成AI"
query = "生成AI"

[[topics]]
name = "航空貨物"
query = "航空貨物"

[[topics]]
name = "港湾"
query = "港湾"

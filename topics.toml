# ===========================================================
#  ニュースダッシュボードの設定ファイル
#  ここを書き換えて保存（Commit）すると、ページが自動で作り直されます。
# ===========================================================

# ページのタイトル
title = "今朝のニュース"

# タイトルの下に小さく表示する説明文
subtitle = "毎朝7時ごろに自動で更新されます。"

# トピックごとに取得する記事の件数
max_items = 10

# 最初から表示しておく件数（残りは「続きを表示」をタップすると出てきます）
show_items = 6

# キャラクターの吹き出しで、AIにまとめてもらうタブ
# （ここに書いたタブの見出しだけをまとめます。空にする "" と全タブをまとめます）
ai_summary_tab = "経済"

# -----------------------------------------------------------
#  タブの一覧（左から順に並びます。いちばん左のタブが最初に表示されます）
#  ・color … タブの色（#から始まる色コード）
# -----------------------------------------------------------
[[tabs]]
name = "経済"
color = "#e8590c"

[[tabs]]
name = "AI・DX"
color = "#6f42c1"

[[tabs]]
name = "物流"
color = "#0b8a5a"

# -----------------------------------------------------------
#  トピックの一覧
#  ・追加したいとき … [[topics]] から query の行までの4行をコピーして下に貼り付け、
#                      name と query を書き換えます
#  ・削除したいとき … その4行を消します
#  ・tab   … どのタブに表示するか（上の [[tabs]] の name と同じ文字にします）
#  ・name  … カードに表示する名前
#  ・query … Googleニュースで検索する言葉
#            例） "物流 DX"        → 両方の言葉を含む記事
#                 "港湾 OR 港運"   → どちらかの言葉を含む記事
#  ※ 文字は必ず " " （半角のダブルクォーテーション）で囲んでください
# -----------------------------------------------------------
[[topics]]
tab = "経済"
name = "決算"
query = "決算"

[[topics]]
tab = "経済"
name = "株価"
query = "株価"

[[topics]]
tab = "経済"
name = "増益"
query = "増益"

[[topics]]
tab = "AI・DX"
name = "物流 DX"
query = "物流 DX"

[[topics]]
tab = "AI・DX"
name = "生成AI"
query = "生成AI -ポルノ -彼女 -変態 -アダルト -エロ"

[[topics]]
tab = "AI・DX"
name = "DX推進"
query = "DX推進"

[[topics]]
tab = "AI・DX"
name = "Copilot"
query = "Copilot"

[[topics]]
tab = "AI・DX"
name = "Power Platform"
query = "\"Power Platform\""

[[topics]]
tab = "AI・DX"
name = "AIエージェント"
query = "AIエージェント"

[[topics]]
tab = "物流"
name = "倉庫"
query = "倉庫"

[[topics]]
tab = "物流"
name = "航空貨物"
query = "航空貨物"

[[topics]]
tab = "物流"
name = "港湾"
query = "港湾"
